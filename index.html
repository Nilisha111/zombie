<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie 🧟‍♀️</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=DM+Sans:wght@400;500;600;700&family=UnifrakturCook:wght@700&family=Jacquard+24&family=Rubik+Glitch&display=swap"
      rel="stylesheet"
    />

    <script src="script.js" defer></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="skull.js"></script>
    <script type="module" src="bat.js"></script>
  </head>

  <body><div id="intro">
    <video class="background-video" autoplay muted loop playsinline>
      <source src="accessories/zombiee.mp4" type="video/mp4" />
    </video>

    <main class="container">
      <div class="top-label">
        <span>🧛🏼‍♀️</span>A PERSONALITY QUIZ<span>🧛🏼‍♀️</span>
      </div>
      <div id="skull-container">
        <canvas id="skull-canvas"></canvas>
      </div>
      <header class="hero">
        <h1>What Kind of <span>Monster</span> are You?</h1>
      </header>
      
      <canvas id="bat-canvas"></canvas>
    </main>
    <div class="welcome-box">
      <h2>Ready to discover your dark side?</h2>
      <p>
        Take this quiz to find out the type of monster you are hiding !
      </p>

      <div class="monster-row">
        <span class="vampire">🧛🏼‍♀️</span>
        <span class="wolf">🐺</span>
        <span class="kichkandi">🧙🏼‍♀️</span>
        <span class="zombie">🧟‍♀️</span>
      </div>
      <p class="quiz-info">Only 20 Questions will unveil your trueself 😈</p>
      <button>START QUIZ 🎃</button>

      <p class="warning">⚠️ Warning: Results may not satisfy you ⚠️</p>
    </div>
    </div>
    <div id="quiz" class="hidden">
      <h2>Question 1</h2>
    </div>
  </body>
</html>
